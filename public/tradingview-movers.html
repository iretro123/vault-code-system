<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradingView stock movers</title>
<style>html,body{margin:0;background:#131722;color:#b2b5be;font:13px system-ui}.tradingview-widget-copyright{text-align:center;padding:12px}.tradingview-widget-copyright a{color:#80b7ff}#failure{padding:16px;line-height:1.5}button{color:white;background:#2962ff;border:0;border-radius:8px;padding:10px 16px}</style></head>
<body>
<p id="failure" role="status" hidden>The TradingView list could not load in this browser. Try reloading, or open this same Vault page in Chrome or Safari.</p>
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>
<div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/markets/stocks-usa/" rel="noopener nofollow" target="_blank">Stocks today</a> by TradingView</div>
<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-hotlists.js" async>
{"colorTheme":"dark","dateRange":"1D","exchange":"US","showChart":false,"locale":"en","width":"100%","height":407,"largeChartUrl":"","isTransparent":false,"showSymbolLogo":true,"showFloatingTooltip":false}
</script>
</div>
<script>
// Do not mistake an empty about:blank iframe for loaded market data.
setTimeout(() => {
  const frame = document.querySelector('iframe');
  try {
    if (!frame || (frame.contentDocument && !frame.contentDocument.body?.textContent?.trim())) {
      document.getElementById('failure').hidden = false;
      if (frame) frame.style.height = '0px';
    }
  } catch (_) { /* A navigated cross-origin document belongs to TradingView. */ }
}, 12000);
</script>
</body></html>
